<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>
<body>

    <h1>Form</h1>

    <form action="/login" method="POST">

        Name
        <input type="text" name="name" id="name" value="" placeholder="Enter your name">

        Roll No
        <input type="text" name="rollno" id="rollno" value="" placeholder="Enter your roll no">

        Department
        <input type="text" name="department" id="department" value="" placeholder="Enter your department">

        <input type="submit" value="Submit">

    </form>

</body>
</html>
